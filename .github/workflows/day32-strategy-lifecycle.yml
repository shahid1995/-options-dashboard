name: StrikeNova Day 32 Strategy Lifecycle

on:
  pull_request:
    paths:
      - "options-dashboard-project/backend/app/strategy_lifecycle/**"
      - "options-dashboard-project/backend/tests/test_day32_strategy_lifecycle.py"
      - "options-dashboard-project/docs/superpowers/specs/2026-09-03-strikenova-day32-strategy-lifecycle-opportunity-gate-design.md"
      - "options-dashboard-project/docs/superpowers/plans/2026-09-04-strikenova-day32-strategy-lifecycle-opportunity-gate.md"
  push:
    paths:
      - "options-dashboard-project/backend/app/strategy_lifecycle/**"
      - "options-dashboard-project/backend/tests/test_day32_strategy_lifecycle.py"
      - ".github/workflows/day32-strategy-lifecycle.yml"

jobs:
  focused:
    name: Day 32 focused tests and static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: options-dashboard-project/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile Day 32 package
        run: python -m py_compile app/strategy_lifecycle/__init__.py app/strategy_lifecycle/contracts.py app/strategy_lifecycle/lifecycle.py
      - name: Run Day 32 focused tests
        run: python -m pytest -q tests/test_day32_strategy_lifecycle.py
      - name: Check whitespace
        run: git diff --check
