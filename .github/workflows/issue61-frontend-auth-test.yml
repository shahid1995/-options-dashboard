name: Issue 61 frontend auth test

on:
  push:
    branches:
      - fix/61-secure-cookie-auth-transport

jobs:
  frontend-auth-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: options-dashboard-project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: options-dashboard-project/frontend/package-lock.json
      - run: npm ci
      - run: npm test -- session-transport.test.js components/AuthGate.test.js
