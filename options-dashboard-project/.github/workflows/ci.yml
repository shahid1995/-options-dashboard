name: CI

on:
  push:
    branches: [main, feat/*]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: options-dashboard-project/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify imports
        run: python -c "from app.main import app; print('App starts OK, routes:', len(list(app.openapi()['paths'].keys())))"
      - name: Run GEX tests
        run: python -m pytest tests/test_live_gex.py tests/test_gex_capture.py tests/test_gex_reliability.py tests/test_gex_security.py tests/test_historical_gex.py tests/test_historical_gex_analytics.py tests/test_gex_data_quality.py tests/test_upstox_market_feed.py -q
      - name: Run candle tests
        run: python -m pytest tests/test_candle_validation.py tests/test_candle_normalization.py tests/test_candle_coverage.py -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: options-dashboard-project/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npx vitest run
      - name: Build
        run: npx next build
