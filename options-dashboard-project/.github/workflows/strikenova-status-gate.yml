name: StrikeNova Status Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feat/**']

permissions:
  contents: read

jobs:
  status-synchronization:
    name: Plan ↔ status synchronization
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify StrikeNova status synchronization
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          PLAN='options-dashboard-project/docs/superpowers/plans/2026-09-02-strikenova-architecture-blueprint-v1-master-implementation-plan.md'
          STATUS='options-dashboard-project/docs/superpowers/STRIKENOVA_IMPLEMENTATION_STATUS.md'

          if [[ ! -f "$PLAN" ]]; then
            echo "ERROR: master implementation plan is missing: $PLAN"
            exit 1
          fi

          if [[ ! -f "$STATUS" ]]; then
            echo "ERROR: implementation status ledger is missing: $STATUS"
            exit 1
          fi

          if [[ "$BASE_SHA" =~ ^0+$ ]]; then
            CHANGED="$(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")"
          else
            CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          fi

          echo "Changed files:"
          printf '%s\n' "$CHANGED"

          IMPLEMENTATION_CHANGE=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              options-dashboard-project/backend/*|
              options-dashboard-project/frontend/*|
              options-dashboard-project/alembic.ini|
              options-dashboard-project/pyproject.toml|
              options-dashboard-project/requirements*.txt|
              options-dashboard-project/package.json|
              options-dashboard-project/package-lock.json|
              options-dashboard-project/.github/workflows/*)
                # The status gate itself is infrastructure for this policy; changing it
                # still requires a status update because policy changes are milestones.
                IMPLEMENTATION_CHANGE=1
                ;;
            esac
          done <<< "$CHANGED"

          PLAN_CHANGE=0
          if printf '%s\n' "$CHANGED" | grep -Fxq "$PLAN"; then
            PLAN_CHANGE=1
          fi

          STATUS_CHANGE=0
          if printf '%s\n' "$CHANGED" | grep -Fxq "$STATUS"; then
            STATUS_CHANGE=1
          fi

          if [[ "$IMPLEMENTATION_CHANGE" -eq 1 || "$PLAN_CHANGE" -eq 1 ]]; then
            if [[ "$STATUS_CHANGE" -ne 1 ]]; then
              echo "ERROR: implementation/master-plan changes require an update to $STATUS"
              echo "This prevents work from advancing without recording its execution state/evidence."
              exit 1
            fi
          fi

          CURRENT_PLAN_SHA="$(git rev-parse "HEAD:$PLAN")"
          RECORDED_PLAN_SHA="$(grep -E '^\- \*\*Master plan blob SHA at last review:\*\*' "$STATUS" | sed -E 's/.*`([^`]+)`.*/\1/' | head -n 1)"

          if [[ -z "$RECORDED_PLAN_SHA" ]]; then
            echo "ERROR: status ledger does not record the master-plan blob SHA."
            exit 1
          fi

          if [[ "$CURRENT_PLAN_SHA" != "$RECORDED_PLAN_SHA" ]]; then
            echo "ERROR: status ledger is stale relative to the master plan."
            echo "Recorded plan SHA: $RECORDED_PLAN_SHA"
            echo "Current plan SHA:  $CURRENT_PLAN_SHA"
            echo "Read the master plan, then update the status ledger's plan revision before continuing."
            exit 1
          fi

          echo "PASS: StrikeNova master plan and implementation status are synchronized."
